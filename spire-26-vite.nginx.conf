# Configuração para Vite dev server do spire-26
# Este arquivo pode ser removido quando não estiver desenvolvendo

upstream vite_spire26 {
    server 127.0.0.1:5173;
}

server {
    listen 443 ssl http2;
    server_name spire-26.wks.dev;
    root /var/www/spire-26/public;
    index index.php index.html;
    
    ssl_certificate /etc/ssl/certs/wks.dev-fullchain.crt;
    ssl_certificate_key /etc/ssl/private/wks.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Vite HMR WebSocket
    location /@vite/client {
        proxy_pass http://vite_spire26;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Vite assets em desenvolvimento
    location ~ ^/resources/(css|js)/ {
        proxy_pass http://vite_spire26;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/@fs/ {
        proxy_pass http://vite_spire26;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/node_modules/ {
        proxy_pass http://vite_spire26;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / { 
        try_files $uri $uri/ /index.php?$query_string; 
    }
    
    location ~ \.php$ { 
        fastcgi_pass unix:/run/php-fpm/www.sock; 
        fastcgi_index index.php; 
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; 
        include fastcgi_params; 
    }
}
